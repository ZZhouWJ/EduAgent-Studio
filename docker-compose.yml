# EduAgent Studio Docker Compose
# 包含 PostgreSQL + pgvector + Redis + MinIO

version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: EduAgent2026
      POSTGRES_DB: eduagent_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/pgvector:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eduagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduagent
      MINIO_ROOT_PASSWORD: EduAgent2026MinIO
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  pgdata:
  redisdata:
  miniodata:
