name: eduagent-studio

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  APP_DATA_DIR: /app/data
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: ${DB_NAME:-ai_collab_audit_system}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
  API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  IFLYTEK_APP_ID: ${IFLYTEK_APP_ID:-}
  IFLYTEK_API_KEY: ${IFLYTEK_API_KEY:-}
  IFLYTEK_API_SECRET: ${IFLYTEK_API_SECRET:-}
  IFLYTEK_DOC_ID: ${IFLYTEK_DOC_ID:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-ai_collab_audit_system}
      TZ: Asia/Shanghai
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./database/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
      - ./database/03_create_indexes.sql:/docker-entrypoint-initdb.d/03_create_indexes.sql:ro
      - ./database/04_insert_initial_data.sql:/docker-entrypoint-initdb.d/04_insert_initial_data.sql:ro
      - ./database/05_create_views.sql:/docker-entrypoint-initdb.d/05_create_views.sql:ro
      - ./database/06_create_stored_procedures.sql:/docker-entrypoint-initdb.d/06_create_stored_procedures.sql:ro
      - ./database/09_create_a3_tables.sql:/docker-entrypoint-initdb.d/09_create_a3_tables.sql:ro
      - ./database/10_insert_a3_initial_data.sql:/docker-entrypoint-initdb.d/10_insert_a3_initial_data.sql:ro
      - ./database/13_create_knowledge_base.sql:/docker-entrypoint-initdb.d/13_create_knowledge_base.sql:ro
      - ./database/14_create_profile_dialog.sql:/docker-entrypoint-initdb.d/14_create_profile_dialog.sql:ro
      - ./database/15_create_tutor_sessions.sql:/docker-entrypoint-initdb.d/15_create_tutor_sessions.sql:ro
      - ./database/16_create_evidence_tables.sql:/docker-entrypoint-initdb.d/16_create_evidence_tables.sql:ro
      - ./database/17_alter_knowledge_tables.sql:/docker-entrypoint-initdb.d/17_alter_knowledge_tables.sql:ro
      - ./database/18_update_user_passwords.sql:/docker-entrypoint-initdb.d/18_update_user_passwords.sql:ro
      - ./database/19_enhance_student_profiles.sql:/docker-entrypoint-initdb.d/19_enhance_student_profiles.sql:ro
      - ./database/20_align_education_roles.sql:/docker-entrypoint-initdb.d/20_align_education_roles.sql:ro
      - ./database/21_create_platform_settings.sql:/docker-entrypoint-initdb.d/21_create_platform_settings.sql:ro
      - ./database/22_extend_learning_resource_types.sql:/docker-entrypoint-initdb.d/22_extend_learning_resource_types.sql:ro
      - ./database/23_create_learning_resource_reviews.sql:/docker-entrypoint-initdb.d/23_create_learning_resource_reviews.sql:ro
      - ./database/24_align_profile_mastery_scores.sql:/docker-entrypoint-initdb.d/24_align_profile_mastery_scores.sql:ro
      - ./database/25_productize_seed_learning_resources.sql:/docker-entrypoint-initdb.d/25_productize_seed_learning_resources.sql:ro
      - ./database/26_productize_seed_project_outputs.sql:/docker-entrypoint-initdb.d/26_productize_seed_project_outputs.sql:ro
      - ./database/27_create_learning_task_progress.sql:/docker-entrypoint-initdb.d/27_create_learning_task_progress.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-environment
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment: *backend-environment
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  backend_data:
